name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET 10 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: |
          $arguments = @('restore', 'VibeCraft.slnx')
          if ((git ls-files -- ':(glob)**/packages.lock.json').Count -gt 0) {
            $arguments += '--locked-mode'
          }
          dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: dotnet build VibeCraft.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VibeCraft.slnx --configuration Release --no-build

      - name: Run benchmark smoke fixture
        run: dotnet run --project benchmarks/VibeCraft.G1.Benchmarks/VibeCraft.G1.Benchmarks.csproj --configuration Release --no-build -- --job Dry --filter '*BootstrapBenchmark*'

      - name: Verify formatting
        run: dotnet format VibeCraft.slnx --no-restore --verify-no-changes
